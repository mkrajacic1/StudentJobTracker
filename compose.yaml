services:
  scraper:
    build: .
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - ROOT_DIR=/app
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
  
  get_chat_id:
    build: .
    command: ["get_chat_id"]
    env_file:
      - .env
    profiles:
      - setup
  
  manage_categories:
    build: .
    command: ["manage_categories"]
    env_file:
      - .env
    environment:
      - DB_HOST=db
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - setup

  db:
    image: postgres:18
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  db-data: