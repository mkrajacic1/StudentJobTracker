[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "StudentJobTracker"
version = "1.0.0"
dependencies = [
    "dotenv",
    "requests",
    "psycopg[binary]",
    "psycopg_pool",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
setup = "student_job_tracker.cli:main"
scrape = "student_job_tracker.main:main"