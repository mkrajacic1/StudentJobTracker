[build-system]
requires-python = ">= 3.10"
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "StudentJobTracker"
version = "1.0.0"
dependencies = [
    "beautifulsoup4",
    "dotenv",
    "requests",
    "psycopg[binary]",
    "psycopg_pool"
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[project.scripts]
manage_categories = "student_job_tracker.scripts.manage_categories:main"
get_chat_id = "student_job_tracker.scripts.get_chat_id:main"
scrape = "student_job_tracker.scrape:main"